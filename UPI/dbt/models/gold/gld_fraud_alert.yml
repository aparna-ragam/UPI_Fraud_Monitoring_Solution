models:
  - name: alert_results   # <-- match your model filename
    description: "Fraud alert results with severity and status"
    config:
      contract:
        enforced: true
    columns:
      - name: alert_id
        data_type: string
        description: "Unique identifier for the alert"
      - name: fraud_code
        data_type: string
        description: "Fraud rule code"
      - name: customer_id
        data_type: string
        description: "Customer identifier"
      - name: transaction_id
        data_type: string
        description: "Transaction identifier"
      - name: risk_score
        data_type: number
        description: "Calculated risk score"
      - name: alert_severity
        data_type: string
        description: "Severity bucket derived from risk_score"
      - name: alert_status
        data_type: string
        description: "Current status of the alert (default OPEN)"
      - name: hash_diff
        data_type: string
        description: "Row‑level hash for change detection"
      - name: load_ts
        data_type: timestamp
        description: "Load timestamp"
