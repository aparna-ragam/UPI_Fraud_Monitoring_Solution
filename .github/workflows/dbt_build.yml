name: dbt Build - UPI Fraud Monitoring

on:
  repository_dispatch:
    types: [dbt-build]

  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run with --full-refresh'
        required: false
        default: 'false'
        type: boolean

jobs:
  dbt-build:
    name: dbt Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DBT_PROJECT_DIR: UPI-Coco/dbt
      SNOWFLAKE_ACCOUNT_CORTEX: ${{ secrets.SNOWFLAKE_ACCOUNT_CORTEX }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ACCOUNTADMIN
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_DATABASE: UPI_FRAUD_MONITORING
      SNOWFLAKE_SCHEMA: STAGING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake==1.9.* snowflake-connector-python cryptography

      - name: Write private key to file
        run: |
          echo "${SNOWFLAKE_PRIVATE_KEY}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          default:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT_CORTEX}
                user: ${SNOWFLAKE_USER}
                role: ${SNOWFLAKE_ROLE}
                database: ${SNOWFLAKE_DATABASE}
                warehouse: ${SNOWFLAKE_WAREHOUSE}
                schema: ${SNOWFLAKE_SCHEMA}
                private_key_path: /tmp/rsa_key.p8
                threads: 4
          EOF

      - name: Set LOAD_ID
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "LOAD_ID=${{ github.event.client_payload.load_id }}" >> $GITHUB_ENV
          else
            echo "LOAD_ID=MANUAL_${{ github.run_id }}" >> $GITHUB_ENV
          fi

      - name: Update LOAD_AUDIT - dbt STARTED
        run: |
          python3 -c "
          import snowflake.connector, os
          from cryptography.hazmat.primitives import serialization
          with open('/tmp/rsa_key.p8', 'rb') as f:
              p_key = serialization.load_pem_private_key(f.read(), password=None)
          pkb = p_key.private_bytes(
              encoding=serialization.Encoding.DER,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          )
          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT_CORTEX'],
              user=os.environ['SNOWFLAKE_USER'],
              private_key=pkb,
              role=os.environ['SNOWFLAKE_ROLE'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database=os.environ['SNOWFLAKE_DATABASE'],
              schema='STAGING'
          )
          load_id = os.environ['LOAD_ID']
          cur = conn.cursor()
          cur.execute(\"UPDATE LOAD_AUDIT SET DBT_STATUS = 'STARTED', DBT_LOAD_START_TIME = CURRENT_TIMESTAMP() WHERE LOAD_ID = '\" + load_id + \"'\")
          if cur.rowcount == 0:
              cur.execute(\"INSERT INTO LOAD_AUDIT (LOAD_ID, FOLDER_NAME, SOURCE_FILE, LOAD_START_TIME, STATUS, DBT_STATUS, DBT_LOAD_START_TIME) VALUES ('\" + load_id + \"', 'dbt_build', 'github_actions', CURRENT_TIMESTAMP(), 'SUCCESS', 'STARTED', CURRENT_TIMESTAMP())\")
          conn.close()
          "

      - name: dbt deps
        run: dbt deps --project-dir ${{ env.DBT_PROJECT_DIR }}

      - name: dbt seed
        run: dbt seed --project-dir ${{ env.DBT_PROJECT_DIR }}

      - name: dbt build
        id: dbt_build
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            dbt build --project-dir ${{ env.DBT_PROJECT_DIR }} --full-refresh
          else
            dbt build --project-dir ${{ env.DBT_PROJECT_DIR }}
          fi

      - name: dbt build summary
        if: always()
        run: |
          echo "## dbt Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Load ID:** ${{ env.LOAD_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.dbt_build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Update LOAD_AUDIT - dbt SUCCESS/FAILED
        if: always()
        run: |
          python3 -c "
          import snowflake.connector, os
          from cryptography.hazmat.primitives import serialization
          with open('/tmp/rsa_key.p8', 'rb') as f:
              p_key = serialization.load_pem_private_key(f.read(), password=None)
          pkb = p_key.private_bytes(
              encoding=serialization.Encoding.DER,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          )
          conn = snowflake.connector.connect(
              account=os.environ['SNOWFLAKE_ACCOUNT_CORTEX'],
              user=os.environ['SNOWFLAKE_USER'],
              private_key=pkb,
              role=os.environ['SNOWFLAKE_ROLE'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database=os.environ['SNOWFLAKE_DATABASE'],
              schema='STAGING'
          )
          load_id = os.environ['LOAD_ID']
          dbt_status = 'SUCCESS' if '${{ steps.dbt_build.outcome }}' == 'success' else 'FAILED'
          conn.cursor().execute(\"UPDATE LOAD_AUDIT SET DBT_STATUS = '\" + dbt_status + \"', DBT_LOAD_END_TIME = CURRENT_TIMESTAMP() WHERE LOAD_ID = '\" + load_id + \"'\")
          conn.close()
          "

      - name: Cleanup
        if: always()
        run: rm -f /tmp/rsa_key.p8
