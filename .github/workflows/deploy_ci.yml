name: Deploy CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install dbt-snowflake snowflake-connector-python

      - name: Validate dbt project
        run: dbt debug --project-dir dbt

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install dbt-snowflake snowflake-connector-python

      # --- Snowflake script execution disabled ---
      # - name: Run Snowflake scripts (Dev)
      #   env:
      #     SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
      #     SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      #     SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      #     SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      #     SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      #     SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      #   run: |
      #     for file in Snowflake/*.sql; do
      #       python -c "import snowflake.connector, os; conn=snowflake.connector.connect(account=os.environ['SNOWFLAKE_ACCOUNT'],user=os.environ['SNOWFLAKE_USER'],password=os.environ['SNOWFLAKE_PASSWORD'],role=os.environ['SNOWFLAKE_ROLE'],database=os.environ['SNOWFLAKE_DATABASE'],warehouse=os.environ['SNOWFLAKE_WAREHOUSE']); cur=conn.cursor(); cur.execute(open('$file').read()); cur.close(); conn.close()"
      #     done

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
UPI_Fraud_Monitoring:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
      user: ${{ secrets.SNOWFLAKE_USER }}
      password: ${{ secrets.SNOWFLAKE_PASSWORD }}
      role: ${{ secrets.SNOWFLAKE_ROLE }}
      database: ${{ secrets.SNOWFLAKE_DATABASE }}
      warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
      threads: 4
      client_session_keep_alive: False
EOF

      - name: Show profiles.yml
        run: cat ~/.dbt/profiles.yml

      - name: Run dbt models (Dev)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: dbt run --project-dir dbt
